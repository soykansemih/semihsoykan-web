
<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <title>Semih Soykan | Dijital Çözümler</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; font-family: 'JetBrains Mono', system-ui, sans-serif; background: #fbfbfb; color: #121212; overflow: hidden; }
      .font-display { font-family: 'Archivo Black', 'JetBrains Mono', system-ui, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: -.01em; }
      .room-root { position: fixed; inset: 0; overflow: hidden;
        background: #fbfbfb; }
      .room-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
        padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); pointer-events: none; }
      .room-top > * { pointer-events: auto; }
      .room-menu { position: absolute; left: 0; right: 0; margin-inline: auto; width: max-content; bottom: max(20px, env(safe-area-inset-bottom));
        display: flex; gap: 4px; padding: 6px; background: #fff; border-radius: 0;
        border: 2px solid #121212; box-shadow: 6px 6px 0 #121212; max-width: calc(100vw - 24px); overflow-x: auto; }
      .room-menu-item { padding: 10px 16px; border-radius: 0; font-weight: 700; font-size: 14px; color: #1f1f1f; white-space: nowrap; transition: .2s; }
      .room-menu-item:hover { background: #fbfbfb; color: #121212; }
      .room-menu-item.is-active { background: #fbfbfb; color: #121212; }
      .room-menu-item.is-cta { background: #ffe600; color: #000; }
      .room-menu-item.is-cta:hover { background: #121212; color: #ffe600; }
      .room-hint { position: absolute; right: max(20px, env(safe-area-inset-right)); bottom: max(32px, env(safe-area-inset-bottom)); font-size: 13px; color: #252525; pointer-events: none; }
      @media (max-width: 1560px) { .room-hint { display: none; } }
      @media (max-width: 520px) { .room-menu { gap: 0; padding: 4px; width: auto; max-width: none; left: 10px; right: 10px; justify-content: space-between; } .room-menu-item { flex: 1 1 auto; padding: 9px 4px; font-size: 12px; text-align: center; } }
      .room-panel { position: absolute; top: 88px; right: max(20px, env(safe-area-inset-right)); max-height: calc(100dvh - 184px); width: min(400px, calc(100vw - 40px));
        background: #fff; border-radius: 0; padding: 22px; overflow: hidden; border: 2px solid #121212; box-shadow: 6px 6px 0 #121212;
        animation: panel-in .35s cubic-bezier(.2,.9,.3,1.2); }
      .room-panel.is-wide { width: min(600px, calc(100vw - 40px)); }
      .fit-stack > * + * { margin-top: 16px; }
      .room-panel[data-compact] > div:first-child { margin-bottom: 8px; }
      .room-panel[data-compact] h2 { font-size: 18px; line-height: 1.2; }
      .room-panel[data-compact] .fit-stack > * + * { margin-top: 10px; }
      .room-panel[data-compact] .fit-title { font-size: 15px; line-height: 1.25; }
      .room-panel[data-compact] .fit-desc { font-size: 12px; line-height: 1.4; margin-top: 2px; }
      .room-panel[data-compact] .fit-note { font-size: 11px; line-height: 1.35; margin-top: 4px; }
      .room-full { position: fixed; inset: 0; z-index: 60; background: rgba(18,18,18,.6); display: flex; align-items: center; justify-content: center; padding: 24px; animation: pop .25s ease-out; }
      .room-full-win { width: min(1400px, 100%); height: min(900px, 100%); background: #fff; border-radius: 0; overflow: hidden; display: flex; flex-direction: column; border: 2px solid #121212; box-shadow: 10px 10px 0 #121212; }
      @media (max-width: 640px) { .room-full { padding: 8px; } }
      @media (max-width: 640px) { .room-panel { top: auto; left: 12px; right: 12px; width: auto; bottom: 84px; max-height: calc(100dvh - 96px); padding: 16px; z-index: 50; } }
      @media (min-width: 641px) and (max-height: 760px) { .room-panel { top: 12px; max-height: calc(100dvh - 108px); z-index: 50; } }
      @media (max-height: 560px) { .room-panel { top: 12px; bottom: auto; max-height: calc(100dvh - 24px); z-index: 50; } }
      @keyframes panel-in { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
      .room-tip { background: #121212; color: #fff; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 0; white-space: nowrap; }
      .room-bubble { background: #fff; color: #121212; font-weight: 800; font-size: 14px; padding: 10px 16px; border-radius: 0; white-space: nowrap;
        border: 2px solid #121212; box-shadow: 4px 4px 0 #121212; animation: pop .4s cubic-bezier(.2,.9,.3,1.4); cursor: pointer; font-family: 'JetBrains Mono', sans-serif; }
      @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
      .room-input { width: 100%; padding: 12px 16px; border-radius: 0; background: #fff; border: 2px solid #121212; outline: none; font: inherit; color: #121212; }
      .room-input:focus { background: #ffe600; }
      .room-panel.is-phone { width: min(330px, calc(100vw - 40px)); }
      .room-phone { margin: 0 auto; width: 100%; max-width: 280px; aspect-ratio: 9 / 18.5; background: #0a0a0a; border-radius: 42px; padding: 10px; box-shadow: 0 18px 40px -16px rgba(59,51,72,.6), inset 0 0 0 2px #121212; }
      .room-phone-screen { position: relative; height: 100%; border-radius: 33px; overflow: hidden; background: #f1f1f1; color: #121212; padding: 12px 16px; display: flex; flex-direction: column; font-family: Archivo Black, sans-serif; }
      .room-phone-status { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; padding: 0 6px; }
      .room-phone-notch { width: 78px; height: 22px; background: #0a0a0a; border-radius: 999px; }
      .room-phone-widget { margin-top: 22px; padding: 14px; border-radius: 22px; background: #fff; border: 2px solid #121212; }
      .room-phone-grid { margin-top: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 10px; }
      .room-phone-app { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; text-align: center; color: #121212; transition: transform .15s; }
      .room-phone-app img { width: 62px; height: 62px; border-radius: 16px; object-fit: cover; box-shadow: 0 6px 14px -6px rgba(0,0,0,.45); }
      .room-phone-icon { width: 62px; height: 62px; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px -6px rgba(0,0,0,.45); }
      .room-phone-app .room-phone-icon img { width: 30px; height: 30px; border-radius: 0; box-shadow: none; filter: invert(1); }
      .room-phone-app:hover { transform: translateY(-3px); }
      .room-phone-app:active { transform: scale(.92); }
      .room-phone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 110px; height: 5px; border-radius: 999px; background: #121212; }
      @media (max-width: 640px) { .room-phone { border-radius: 34px; padding: 8px; } .room-phone-screen { border-radius: 27px; } }
      .room-store { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 0; background: #121212; color: #fff; font-size: 13px; font-weight: 800; transition: .2s; }
      .room-store:hover { background: #ffe600; color: #121212; }
      .room-btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 18px; border-radius: 0; background: #ffe600; color: #000; font-weight: 800; transition: .2s; }
      .room-btn:hover { background: #121212; color: #ffe600; }
      .room-btn:disabled { opacity: .6; }
      .room-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #252525; font-weight: 700; }
      .room-loading-box { width: 44px; height: 44px; border-radius: 0; background: #ffe600; animation: hop 0.9s ease-in-out infinite; }
      @keyframes hop { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-18px) rotate(90deg); } }
      button:focus-visible, a:focus-visible { outline: 3px solid #121212; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { .room-panel, .room-bubble { animation: none; } }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
